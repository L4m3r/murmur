[package]
name = "celld-prefix-semantics"
version = "0.0.0"
edition = "2021"
[dependencies]
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
object_store = { version = "=0.12.5", default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
